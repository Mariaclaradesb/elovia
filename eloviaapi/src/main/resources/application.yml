server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: eloviaapi

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DATABASE_USERNAME:postgres.citxmlurmzvkokjbtnhh}
    password: ${DATABASE_PASSWORD:TROQUE_PELA_SUA_SENHA}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:1}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:0}
      initialization-fail-timeout: ${DATABASE_INIT_FAIL_TIMEOUT:0}
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: ${HIBERNATE_JDBC_METADATA_ACCESS:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:25MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:30MB}

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      "mail.smtp.auth": ${MAIL_SMTP_AUTH:true}
      "mail.smtp.starttls.enable": ${MAIL_STARTTLS_ENABLE:true}
      "mail.smtp.connectiontimeout": ${MAIL_CONNECTION_TIMEOUT:5000}
      "mail.smtp.timeout": ${MAIL_TIMEOUT:5000}
      "mail.smtp.writetimeout": ${MAIL_WRITE_TIMEOUT:5000}

management:
  health:
    db:
      enabled: ${DB_HEALTH_ENABLED:false}
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  email:
    enabled: ${EMAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@elovia.com.br}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:15}
  admin:
    email: ${ADMIN_EMAIL:admin@elovia.test}
    password: ${ADMIN_PASSWORD:Admin12345}
  test-data:
    enabled: ${TEST_DATA_ENABLED:true}
  supabase:
    url: ${SUPABASE_URL:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:documentos-alunos}
