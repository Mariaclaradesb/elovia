server:
  address: 0.0.0.0
  port: ${PORT:8080}

spring:
  application:
    name: eloviaapi

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:5432/postgres?sslmode=require}
    username: ${DATABASE_USERNAME:postgres.citxmlurmzvkokjbtnhh}
    password: ${DATABASE_PASSWORD:TROQUE_PELA_SUA_SENHA}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:1}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:0}
      initialization-fail-timeout: ${DATABASE_INIT_FAIL_TIMEOUT:0}
      idle-timeout: 30000
      max-lifetime: 300000
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:none}
    open-in-view: false
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: ${HIBERNATE_JDBC_METADATA_ACCESS:false}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: ${FLYWAY_ENABLED:true}

management:
  health:
    db:
      enabled: ${DB_HEALTH_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info

app:
  security:
    enabled: ${SECURITY_ENABLED:true}
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-com-pelo-menos-32-caracteres}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  admin:
    email: ${ADMIN_EMAIL:admin@elovia.test}
    password: ${ADMIN_PASSWORD:Admin12345}
  test-data:
    enabled: ${TEST_DATA_ENABLED:true}
